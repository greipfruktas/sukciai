services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sukciai
      POSTGRES_USER: sukciai
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sukciai -d sukciai"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
